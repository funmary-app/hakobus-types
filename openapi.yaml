openapi: 3.1.0
info:
  title: バス時刻表 API
  version: 1.0.0
  summary: 1 つのバス事業者の時刻表を返す、読み取り専用の小さな API
  description: |
    形は GTFS-JP の表(`stops`、`routes`、`calendar`、`calendar_dates`、`trips`、`stop_times`)に合わせてある。GTFS-JP のデータは、欠けなくこの形に写せる。

    この定義を実装するサーバーは、返すデータの権利について責任を持つ。
  license:
    name: BSD-3-Clause OR Apache-2.0
    identifier: BSD-3-Clause OR Apache-2.0
security: []
servers:
  - url: https://bus.example.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: サーバーが動いているかを確かめる
      responses:
        '200':
          description: 動いている。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
  /v1/timetable:
    get:
      operationId: getTimetable
      summary: 時刻表の全体を取る
      description: |
        すべての停留所、系統、運行日、便を、1 回の応答で返す。時刻表が変わるのは事業者がダイヤを改正したときだけなので、クライアントは保存しておき、前回の `ETag` を `If-None-Match` に付けて送る。
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 時刻表。
          headers:
            ETag:
              description: 今の時刻表を見分ける値。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timetable'
        '304':
          description: クライアントの持っているものが最新。
        '503':
          description: サーバーに、まだ時刻表がない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Timetable:
      type: object
      required: [schemaVersion, generatedAt, stops, routes, services, trips]
      properties:
        schemaVersion:
          type: integer
          const: 1
          description: この形が、互換のない形で変わったときだけ上がる。
        generatedAt:
          type: string
          format: date-time
          description: サーバーがこの応答を組み立てた日時。
        validFrom:
          type: string
          format: date
          description: 時刻表が有効になる最初の日(Asia/Tokyo)。
        validUntil:
          type: string
          format: date
          description: 時刻表が有効な最後の日(Asia/Tokyo)。
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
    Stop:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    Route:
      type: object
      required: [id, shortName]
      properties:
        id:
          type: string
        shortName:
          type: string
          description: バスに表示される番号。`55A` など。
        longName:
          type: string
    Service:
      type: object
      description: ある便が走る日の集まり。
      required: [id, weekdays, startDate, endDate]
      properties:
        id:
          type: string
        weekdays:
          type: object
          required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
          properties:
            monday: { type: boolean }
            tuesday: { type: boolean }
            wednesday: { type: boolean }
            thursday: { type: boolean }
            friday: { type: boolean }
            saturday: { type: boolean }
            sunday: { type: boolean }
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        exceptions:
          type: array
          items:
            type: object
            required: [date, type]
            properties:
              date:
                type: string
                format: date
              type:
                type: string
                enum: [added, removed]
    Trip:
      type: object
      required: [id, routeId, serviceId, stopTimes]
      properties:
        id:
          type: string
        routeId:
          type: string
        serviceId:
          type: string
        directionId:
          type: integer
          enum: [0, 1]
        headsign:
          type: string
          description: バスに表示される行き先。
        stopTimes:
          type: array
          description: バスが停留所をまわる順。
          items:
            $ref: '#/components/schemas/StopTime'
    StopTime:
      type: object
      required: [stopId, sequence, arrival, departure]
      properties:
        stopId:
          type: string
        sequence:
          type: integer
          minimum: 0
        arrival:
          $ref: '#/components/schemas/TimeOfDay'
        departure:
          $ref: '#/components/schemas/TimeOfDay'
    TimeOfDay:
      type: string
      pattern: '^[0-9]{2}:[0-5][0-9]:[0-5][0-9]$'
      description: Asia/Tokyo の時刻を `HH:MM:SS` で表す。深夜をまたぐ便では、時が 24 以上になる。
      examples: ['07:45:00', '24:10:00']
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
