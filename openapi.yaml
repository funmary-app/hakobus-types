openapi: 3.1.0
info:
  title: バス時刻表 API
  version: 2.0.0
  summary: 1 つのバス事業者の、停留所ごとの発車表を返す、読み取り専用の小さな API
  description: |
    バス停(停留所)ごとの発車表を返す。事業者が公開している時刻表と同じく、「どの停留所に、何時何分に、どの系統が来るか」を表す。便をまたいで停留所をたどる情報(GTFS の `stop_times` のような)は持たない。

    時刻表は「ダイヤの版」ごとに変わる。事業者がダイヤを改正すると、新しい版が増える。サーバーは、改正の前から次の版を返せる。

    この定義を実装するサーバーは、返すデータの権利について責任を持つ。
  license:
    name: BSD-3-Clause OR Apache-2.0
    identifier: BSD-3-Clause OR Apache-2.0
security: []
servers:
  - url: https://bus.example.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: サーバーが動いているかを確かめる
      responses:
        '200':
          description: 動いている。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
  /v1/stops:
    get:
      operationId: listStops
      summary: 停留所の一覧と、ダイヤの版の一覧を取る
      description: |
        サーバーが発車表を持つ停留所を、すべて返す。時刻表は変わりにくいので、クライアントは保存しておき、前回の `ETag` を `If-None-Match` に付けて送る。
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 停留所の一覧。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopList'
        '304':
          description: クライアントの持っているものが最新。
        '503':
          description: サーバーに、まだ時刻表がない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/stops/{stopId}:
    get:
      operationId: getStop
      summary: 1 つの停留所の発車表を取る
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
        - name: generation
          in: query
          required: false
          description: ダイヤの版のコード。省略すると、いま使われている版。
          schema:
            type: integer
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 停留所の発車表。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopTimetable'
        '304':
          description: クライアントの持っているものが最新。
        '404':
          description: その停留所か版が、サーバーにない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: 今の応答を見分ける値。
      schema:
        type: string
  schemas:
    StopList:
      type: object
      required: [schemaVersion, generatedAt, generations, stops]
      properties:
        schemaVersion:
          type: integer
          const: 2
          description: この形が、互換のない形で変わったときだけ上がる。
        generatedAt:
          type: string
          format: date-time
          description: サーバーがこの応答を組み立てた日時。
        generations:
          type: array
          description: サーバーが知っているダイヤの版。新しい版は、有効になる前から入る。
          items:
            $ref: '#/components/schemas/Generation'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/StopSummary'
    Generation:
      type: object
      required: [code, name, current]
      properties:
        code:
          type: integer
          description: 版のコード。`20261001` のように、有効になる日の 8 桁。
        name:
          type: string
          description: 事業者が使う呼び名。`令和8年10月1日` など。
        current:
          type: boolean
          description: いま使われている版か。
    StopSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 事業者の停留所コード。
        name:
          type: string
    StopTimetable:
      type: object
      required: [schemaVersion, generatedAt, generation, stop, timetables]
      properties:
        schemaVersion:
          type: integer
          const: 2
        generatedAt:
          type: string
          format: date-time
        fetchedAt:
          type: string
          format: date-time
          description: サーバーが事業者から、この停留所の発車表を取った日時。
        generation:
          $ref: '#/components/schemas/Generation'
        stop:
          $ref: '#/components/schemas/StopSummary'
        timetables:
          type: array
          description: のりばと曜日の区分ごとの発車表。
          items:
            $ref: '#/components/schemas/PlatformTimetable'
    PlatformTimetable:
      type: object
      required: [platformNo, day, notes, departures]
      properties:
        platformNo:
          type: integer
          description: のりばの番号。事業者の標柱の番号。
        platformName:
          type: string
          description: のりばの名前。`（１）バスターミナル１番のりば` など。
        day:
          $ref: '#/components/schemas/DayType'
        notes:
          type: array
          description: 事業者が時刻表に添えた注意書き。印(`△` など)の意味もここにある。
          items:
            type: string
        departures:
          type: array
          description: 発車時刻の順。
          items:
            $ref: '#/components/schemas/Departure'
    DayType:
      type: string
      enum: [weekday, holiday]
      description: '`weekday` は平日、`holiday` は土曜・日曜・祝日。'
    Departure:
      type: object
      required: [time, routes]
      properties:
        time:
          $ref: '#/components/schemas/TimeOfDay'
        routes:
          type: array
          description: この発車表の列にある系統の番号。`["51", "51A"]` のように、1 つの列に複数の系統があることがある。
          items:
            type: string
        via:
          type: string
          description: 経由地。
        destination:
          type: string
          description: 行き先。
        marks:
          type: array
          description: 時刻に付く印。意味は、同じ発車表の `notes` にある。
          items:
            type: string
    TimeOfDay:
      type: string
      pattern: '^[0-9]{2}:[0-5][0-9]$'
      description: Asia/Tokyo の時刻を `HH:MM` で表す。深夜をまたぐ発車は、時が 24 以上になることがある。
      examples: ['07:43', '24:10']
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
